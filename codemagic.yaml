workflows:
  # =====================================================
  # UNIFIED RELEASE — iOS + Android from a single tag
  # Trigger: push a tag like v1.0.0
  # =====================================================
  release-both:
    name: Release (iOS + Android)
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    integrations:
      app_store_connect: admin
    environment:
      # Signing migrated 2026-08-22 to the fetch-signing-files pattern:
      # the stored-identity flow broke when `studio_distribution_2026`
      # was revoked during the 2026-07-06 cert reset. CERTIFICATE_PRIVATE_KEY
      # (secure var in the `ios_signing` group, base64-encoded PEM) pins one
      # reusable Apple Distribution certificate across builds.
      flutter: stable
      xcode: latest
      cocoapods: default
      java: 17
      groups:
        - google_play
        - ios_signing
      vars:
        PACKAGE_NAME: "com.idealai.silversuite"
        BUNDLE_ID: "com.idealai.silversuite"
    scripts:
      - name: Extract version from pubspec
        script: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          if [ -z "$BUILD_NUMBER" ] || [ "$BUILD_NUMBER" = "$VERSION_NAME" ]; then
            BUILD_NUMBER=$PROJECT_BUILD_NUMBER
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> $CM_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build Android AAB
        script: |
          flutter build appbundle --release \
            --build-name=$VERSION_NAME \
            --build-number=$BUILD_NUMBER \
            --dart-define=USE_TEST_ADS=false

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod repo update
          pod install

      - name: Set up code signing
        script: |
          keychain initialize
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            printf '%s' "$CERTIFICATE_PRIVATE_KEY" | openssl base64 -A -d > /tmp/cert_key.pem
          else
            openssl genrsa -out /tmp/cert_key.pem 2048
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --build-name=$VERSION_NAME \
            --build-number=$BUILD_NUMBER \
            --dart-define=USE_TEST_ADS=false \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        submit_as_draft: true
        # DO NOT add changes_not_sent_for_review while submit_as_draft is true —
        # the two are mutually exclusive; Play rejects with "changesNotSentForReview
        # must not be set." Use changes_not_sent_for_review only with
        # submit_as_draft: false once the app has passed its first review.
      email:
        recipients:
          - nalhamzy@gmail.com
        notify:
          success: true
          failure: true

